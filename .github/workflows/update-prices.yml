name: Refresh prices

# 20:32 UTC on weekdays = 16:32 New York, half an hour after the close and past
# the closing auction. It used to be 21:30, which sounds fine until you measure
# what GitHub actually does: scheduled runs sit in a queue and fired 14-17
# minutes late every single day (21:44, 21:46, 21:46, 21:47). That put the
# reading up at 17:47 New York, nearly two hours after the close, so anyone
# checking in the late afternoon saw yesterday's number and assumed a failure.
#
# The 22:32 run is a backup. GitHub silently SKIPS scheduled runs under load -
# it is documented behaviour, not a fault - and one missed run would otherwise
# freeze the page for a day. Re-running is safe: update_data.py rewrites the
# whole 420-session series each time and refuses to publish a series whose last
# close is older than the one already live, and the commit step below compares
# the last close so an unchanged file never commits.
#
# Rewriting the full series each run also means a provisional closing print gets
# corrected automatically on the next run.
on:
  schedule:
    - cron: "32 20 * * 1-5"
    - cron: "32 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch QQQ closes
        run: python update_data.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # data.json carries an `updated` timestamp, so the file differs on
          # every run. Compare the last close instead, or this always commits
          # and the no-op branch below never fires.
          LAST=$(python -c "import json;print(json.load(open('data.json'))['last_close'])")
          PREV=$(git show HEAD:data.json 2>/dev/null | python -c "import json,sys;print(json.load(sys.stdin)['last_close'])" 2>/dev/null || echo "none")
          if [ "$LAST" = "$PREV" ]; then
            echo "last close still $LAST (market holiday, or already current) - nothing to commit"
            git checkout -- data.json
            exit 0
          fi
          git add data.json
          git commit -m "prices: close $LAST"
          git push
