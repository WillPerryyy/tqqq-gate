name: Refresh prices

# 21:30 UTC on weekdays = 17:30 New York, comfortably after the 16:00 close.
# The rule reads the prior close by design, so once a day is the right cadence.
on:
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch QQQ closes
        run: python update_data.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data.json; then
            echo "data.json unchanged (market holiday, or already current)"
            exit 0
          fi
          LAST=$(python -c "import json;print(json.load(open('data.json'))['last_close'])")
          git add data.json
          git commit -m "prices: close $LAST"
          git push
